<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>สั่งซื้อสินค้า | Dove</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <div class="container site-header__inner">
      <a class="logo" href="index.html">Dove</a>
      <nav class="nav" aria-label="เมนูหลัก">
        <a href="index.html">หน้าแรก</a>
        <a href="product.html">สินค้า</a>
      </nav>
    </div>
  </header>

  <main>

    <section class="page-head">
      <div class="container">
        <h1>สั่งซื้อสินค้า</h1>
        <p class="lead">กรอกข้อมูลของคุณ แล้วกดยืนยันเพื่อสั่งซื้อ</p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <form id="orderForm" class="form">

          <div class="field">
            <label for="customerName">ชื่อลูกค้า</label>
            <input type="text" id="customerName" name="customerName" autocomplete="name" required>
          </div>

          <div class="field">
            <label for="contact">เบอร์โทร / Line</label>
            <input type="text" id="contact" name="contact" autocomplete="tel" required>
          </div>

          <div class="form__summary">
            <div class="field">
              <label for="items">รายการสินค้า</label>
              <input type="text" id="items" name="items" readonly>
            </div>

            <div class="field">
              <label for="total">จำนวนเงินรวม</label>
              <input type="text" id="total" name="total" readonly>
            </div>
          </div>

          <div class="field">
            <label for="note">หมายเหตุ (ถ้ามี)</label>
            <textarea id="note" name="note"></textarea>
          </div>

          <div class="form__actions">
            <button type="submit" class="btn btn--solid">ยืนยันสั่งซื้อ</button>
            <a class="text-link" href="product.html">เลือกสินค้าอื่น</a>
          </div>

        </form>
      </div>
    </section>

  </main>

  <footer class="site-footer">
    <div class="container site-footer__inner">
      <span>&copy; Dove</span>
      <nav aria-label="เมนูท้ายหน้า">
        <a href="product.html">สินค้าทั้งหมด</a>
      </nav>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
